renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

function attachProp(model, h, spec) {
  if (!spec) return null;
  let bone = null; model.traverse(o => { if (o.isBone && o.name === spec.bone) bone = o; });
  if (!bone) return null;
  const pivot = new THREE.Group();
  const tool = TOOLS[spec.tool](); tool.scale.setScalar(h * (spec.scale || 1));
  const inner = new THREE.Group(); inner.add(tool);
  inner.rotation.set(...(spec.rot || [0, 0, 0]));
  inner.position.set(...(spec.pos || [0, 0, 0]).map(v => v * h));
  pivot.add(inner);
  model.updateMatrixWorld(true);
  const ws = new THREE.Vector3(); bone.getWorldScale(ws);
  pivot.scale.set(1 / ws.x, 1 / ws.y, 1 / ws.z);
  bone.add(pivot);
  pivot.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
  return pivot;
}


// ---------- Horse (built in code, procedurally animated; shared by all cavalry) ----------
// Units = fraction of rider standing height H. Faces +Z. Ground at y=0.
function buildHorse(H, colors = {}) {
  const coat = M(colors.coat || 0x6b4226, 0.8), mane = M(colors.mane || 0x2a1a10, 0.9), hoofM = M(0x222222), cloth = new THREE.MeshStandardMaterial({ color: 0xff00ff, roughness: 0.75, side: THREE.DoubleSide }), leather = M(0x4a2e18);
  const S = H, root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const wither = 0.86 * S;                       // shoulder height
  body.position.y = wither - 0.12 * S;
  const torso = new THREE.Mesh(new THREE.SphereGeometry(0.2 * S, 16, 12), coat); torso.scale.set(0.9, 0.95, 2.3); body.add(torso);
  const chest = new THREE.Mesh(new THREE.SphereGeometry(0.17 * S, 12, 10), coat); chest.position.set(0, 0.02 * S, 0.3 * S); body.add(chest);
  const rump = new THREE.Mesh(new THREE.SphereGeometry(0.18 * S, 12, 10), coat); rump.position.set(0, 0.03 * S, -0.3 * S); body.add(rump);
  // neck + head
  const neck = new THREE.Group(); neck.position.set(0, 0.08 * S, 0.36 * S); neck.rotation.x = 0.6; body.add(neck);
  const nm = new THREE.Mesh(new THREE.CylinderGeometry(0.075 * S, 0.12 * S, 0.42 * S, 10), coat); nm.position.y = 0.2 * S; neck.add(nm);
  const mn = box(0.03 * S, 0.4 * S, 0.06 * S, mane); mn.position.set(0, 0.22 * S, -0.075 * S); neck.add(mn);
  const head = new THREE.Group(); head.position.y = 0.4 * S; head.rotation.x = 1.45; neck.add(head);
  const hm = new THREE.Mesh(new THREE.CylinderGeometry(0.045 * S, 0.075 * S, 0.3 * S, 10), coat); hm.position.y = 0.12 * S; head.add(hm);
  for (const sx of [-1, 1]) { const ear = new THREE.Mesh(new THREE.ConeGeometry(0.018 * S, 0.07 * S, 5), coat); ear.position.set(sx * 0.035 * S, -0.01 * S, -0.06 * S); ear.rotation.x = -1.3; head.add(ear); }
  const bridle = new THREE.Mesh(new THREE.TorusGeometry(0.06 * S, 0.008 * S, 4, 12), leather); bridle.position.y = 0.2 * S; bridle.rotation.x = Math.PI / 2; head.add(bridle);
  // tail
  const tail = new THREE.Group(); tail.position.set(0, 0.06 * S, -0.44 * S); body.add(tail);
  const tm = new THREE.Mesh(new THREE.CylinderGeometry(0.018 * S, 0.045 * S, 0.38 * S, 8), mane); tm.position.y = -0.19 * S; tail.add(tm); tail.rotation.x = 0.35;
  // caparison (team colour cloth) + saddle
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.17 * S, 0.215 * S, 0.3 * S, 18, 1, true), cloth); cap.scale.set(1.05, 1, 2.15); cap.position.y = -0.09 * S; body.add(cap);
  if (colors.barding) {   // plate barding: chanfron over the brow (muzzle stays bare) + crinet on the neck
    // head cylinder spans y -0.03..0.27, wide end (skull) low, muzzle narrow and high
    // only the dorsal half is plated (local -Z is the top of the head), so the muzzle and jaw stay horse
    const ch = new THREE.Mesh(new THREE.CylinderGeometry(0.062 * S, 0.082 * S, 0.15 * S, 12, 1, true, Math.PI * 0.46, Math.PI * 1.08), IRON);
    ch.position.y = 0.03 * S; head.add(ch);
    const ridge = box(0.014 * S, 0.15 * S, 0.016 * S, IRON); ridge.position.set(0, 0.03 * S, -0.062 * S); head.add(ridge);
    const cr = new THREE.Mesh(new THREE.CylinderGeometry(0.088 * S, 0.122 * S, 0.3 * S, 10, 1, true), IRON); cr.position.y = 0.15 * S; neck.add(cr);
    if (colors.barding > 1) {
      const spike = new THREE.Mesh(new THREE.ConeGeometry(0.022 * S, 0.1 * S, 6), IRON);
      spike.position.set(0, 0.1 * S, -0.075 * S); spike.rotation.x = -0.5; head.add(spike);
      const pp = new THREE.Mesh(new THREE.SphereGeometry(0.2 * S, 14, 10), IRON);   // peytral: chest plate
      pp.scale.set(0.92, 0.62, 0.42); pp.position.set(0, -0.02 * S, 0.4 * S); body.add(pp);
    }
  }
  const saddle = box(0.2 * S, 0.06 * S, 0.24 * S, leather); saddle.position.set(0, 0.19 * S, 0.02 * S); body.add(saddle);
  const cantle = box(0.18 * S, 0.08 * S, 0.03 * S, leather); cantle.position.set(0, 0.23 * S, -0.1 * S); body.add(cantle);
  // legs: hip pivot -> thigh -> knee pivot -> cannon -> hoof
  const legs = {};
  const legDef = { LF: [-0.1, 0.33], RF: [0.1, 0.33], LH: [-0.1, -0.33], RH: [0.1, -0.33] };
  for (const [k, [x, z]] of Object.entries(legDef)) {
    const hip = new THREE.Group(); hip.position.set(x * S, -0.08 * S, z * S); body.add(hip);
    const up = new THREE.Mesh(new THREE.CylinderGeometry(0.045 * S, 0.06 * S, 0.34 * S, 8), coat); up.position.y = -0.17 * S; hip.add(up);
    const knee = new THREE.Group(); knee.position.y = -0.34 * S; hip.add(knee);
    const lo = new THREE.Mesh(new THREE.CylinderGeometry(0.025 * S, 0.032 * S, 0.3 * S, 6), coat); lo.position.y = -0.15 * S; knee.add(lo);
    const hoof = new THREE.Mesh(new THREE.CylinderGeometry(0.035 * S, 0.042 * S, 0.05 * S, 8), hoofM); hoof.position.y = -0.31 * S; knee.add(hoof);
    legs[k] = { hip, knee, front: k[1] === 'F' };
  }
  root.userData = { body, neck, head, tail, legs, S, baseY: body.position.y, saddleY: body.position.y + 0.22 * S, saddleZ: 0.0 };
  root.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
  return root;
}
// gait: idle | walk | gallop | attack | death ; ph in [0,1)
function poseHorse(horse, gait, ph) {
  const U = horse.userData, T = Math.PI * 2, S = U.S;
  const OFF = gait === 'walk' ? { LH: 0, LF: 0.25, RH: 0.5, RF: 0.75 } : { LH: 0, RH: 0.12, LF: 0.5, RF: 0.62 };
  const amp = gait === 'walk' ? 0.42 : gait === 'gallop' ? 0.75 : 0;
  for (const [k, L] of Object.entries(U.legs)) {
    const a = T * (ph + OFF[k]);
    let th = amp * Math.sin(a), kn = amp ? Math.max(0, Math.sin(a + (L.front ? 0.6 : -0.6))) * amp * 1.3 : 0;
    if (gait === 'attack' && L.front) { const r = Math.max(0, Math.sin(T * ph)); th = -0.5 * r; kn = 1.1 * r; }   // rear-up stamp
    if (gait === 'idle') { th = 0; kn = 0; }
    L.hip.rotation.x = th; L.knee.rotation.x = L.front ? kn : -kn;
  }
  let bob = 0, pitch = 0;
  if (gait === 'walk') bob = 0.012 * S * Math.sin(T * ph * 2);
  if (gait === 'gallop') { bob = 0.04 * S * Math.sin(T * ph); pitch = 0.08 * Math.sin(T * ph + 1); }
  if (gait === 'attack') { const r = Math.max(0, Math.sin(T * ph)); pitch = -0.28 * r; bob = 0.06 * S * r; }
  if (gait === 'idle') bob = 0.004 * S * Math.sin(T * ph);
  U.body.position.y = U.baseY + bob; U.body.rotation.x = pitch;
  U.neck.rotation.x = 0.6 + (gait === 'gallop' ? 0.15 * Math.sin(T * ph) : gait === 'idle' ? 0.06 * Math.sin(T * ph) : gait === 'walk' ? 0.08 * Math.sin(T * ph * 2) : 0);
  U.tail.rotation.x = 0.3 + (gait === 'gallop' ? 0.35 + 0.1 * Math.sin(T * ph * 2) : 0.08 * Math.sin(T * ph));
  horse.rotation.z = 0; horse.position.y = 0;
}

// ---- vehicles built in code: no model file, no rig, no credits ----
// A battering ram: a timber shed on four wheels with a plank roof, an iron-capped log hung
// from the ridge, and a magenta pennant (team colour). pose(gait, ph) turns the wheels as it
// rolls, swings the log back and forth to strike, and collapses it when it is destroyed.
function buildRam() {
  const G0 = new THREE.Group(), wood = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 });
  const dark = wood(0x5a3c22), mid = wood(0x7a5634), light = wood(0x9a7448), iron = new THREE.MeshStandardMaterial({ color: 0x55585e, roughness: 0.5, metalness: 0.6 });
  const box = (w, h, d, m, x, y, z, rx = 0, rz = 0) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.rotation.x = rx; o.rotation.z = rz; G0.add(o); return o; };
  const L = 3.0, W = 1.5, H = 1.5, Y = 0.45;
  // chassis beams and deck
  box(0.16, 0.16, L, dark, -W / 2 + 0.08, Y, 0); box(0.16, 0.16, L, dark, W / 2 - 0.08, Y, 0);
  for (const z of [-L / 2 + 0.1, 0, L / 2 - 0.1]) box(W, 0.12, 0.14, dark, 0, Y, z);
  // corner posts and a pitched plank roof
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(0.12, H, 0.12, mid, sx * (W / 2 - 0.08), Y + H / 2, sz * (L / 2 - 0.12));
  const pitch = 0.62, rw = W * 0.62;
  const r1 = box(rw, 0.07, L + 0.15, light, -W * 0.27, Y + H + 0.22, 0, 0, pitch);
  const r2 = box(rw, 0.07, L + 0.15, light, W * 0.27, Y + H + 0.22, 0, 0, -pitch);
  for (let i = -5; i <= 5; i++) { box(rw + 0.02, 0.02, 0.03, dark, -W * 0.27, Y + H + 0.26, i * 0.28, 0, pitch); box(rw + 0.02, 0.02, 0.03, dark, W * 0.27, Y + H + 0.26, i * 0.28, 0, -pitch); }
  box(0.1, 0.1, L + 0.2, dark, 0, Y + H + 0.48, 0);   // ridge beam
  // hide shields hung along the sides
  const hide = wood(0x8a6a4a);
  for (const sx of [-1, 1]) box(0.04, H * 0.55, L * 0.8, hide, sx * (W / 2 + 0.02), Y + H * 0.55, 0);
  // pennant on the ridge (team colour)
  box(0.03, 0.7, 0.03, dark, 0, Y + H + 0.85, -L / 2 + 0.3);
  const flag = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.28, 0.45), new THREE.MeshStandardMaterial({ color: 0xff00ff, roughness: 0.8 }));
  flag.position.set(0, Y + H + 1.05, -L / 2 + 0.55); G0.add(flag);
  // four wheels
  const wheels = [];
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const wg = new THREE.Group(); wg.position.set(sx * (W / 2 + 0.1), 0.42, sz * (L / 2 - 0.45));
    const rim = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.06, 6, 14), dark); rim.rotation.y = Math.PI / 2; wg.add(rim);
    for (let k = 0; k < 4; k++) { const sp = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.7, 0.06), mid); sp.rotation.x = k * Math.PI / 4; wg.add(sp); }
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.14, 8), iron); hub.rotation.z = Math.PI / 2; wg.add(hub);
    G0.add(wg); wheels.push(wg);
  }
  // the ram: a log hung on two ropes, iron cap at the front
  const ramG = new THREE.Group(); ramG.position.set(0, Y + H - 0.05, 0); G0.add(ramG);
  const log = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, L + 0.9, 10), mid); log.rotation.x = Math.PI / 2; log.position.y = -0.62; ramG.add(log);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.42, 10), iron); cap.rotation.x = Math.PI / 2; cap.position.set(0, -0.62, (L + 0.9) / 2 + 0.2); ramG.add(cap);
  for (const z of [-0.6, 0.6]) { const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.6, 4), wood(0xc8b088)); rope.position.set(0, -0.3, z); ramG.add(rope); }
  G0.userData.pose = (gait, ph) => {
    const T = Math.PI * 2;
    const roll = gait === 'walk' ? -ph * T : 0;
    for (const w of wheels) w.rotation.x = roll;
    ramG.rotation.x = 0; ramG.position.z = 0;
    if (gait === 'attack') { const s = Math.sin(ph * T); ramG.position.z = 0.45 * s; ramG.rotation.x = -0.12 * s; }
    G0.rotation.z = 0; G0.position.y = 0;
    if (gait === 'death') { const k = Math.min(1, ph * 1.3), e = k * k * (3 - 2 * k); G0.rotation.z = e * 0.5; G0.position.y = -e * 0.15; r1.rotation.z = pitch + e * 0.9; r2.rotation.z = -pitch - e * 0.6; }
    if (gait === 'idle') ramG.rotation.x = 0.02 * Math.sin(ph * T);
  };
  return G0;
}

window.renderAll = async function (cfg) {
  const { url, frame = 192, height = 150, anims, dirs = 8, light = 1, dirOffset = 0 } = cfg;
  renderer.setSize(frame, frame);
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xfff4e0, 0x5a4a38, 1.25 * light));
  const sun = new THREE.DirectionalLight(0xfff1d6, 2.4 * light);
  scene.add(sun);
  const gltf = cfg.vehicle ? { scene: buildRam(), animations: [] } : await new GLTFLoader().loadAsync(url);
  const model = gltf.scene;
  model.traverse(o => { if (o.isMesh) { o.frustumCulled = false; if (o.material) o.material.side = THREE.FrontSide; } });
  const holder = new THREE.Group(); holder.add(model); scene.add(holder);
  // measure standing height from the first frame of the first requested clip (or bind pose)
  const mixer = new THREE.AnimationMixer(model);
  const clips = {}; for (const c of gltf.animations) clips[c.name] = c;
  clips.__static = new THREE.AnimationClip('static', 1, []);
  for (const cu of [].concat(cfg.clipsUrl || [])) {   // borrow clips from other files on the same skeleton (bone names match)
    const src = await new GLTFLoader().loadAsync(cu);
    const hipY = r => { let y = 1; r.traverse(o => { if (o.isBone && o.name === 'Hips') y = o.position.y; }); return y; };
    const ratio = hipY(model) / hipY(src.scene);
    for (const c0 of src.animations) {
      const c = c0.clone();
      for (const t of c.tracks) if (t.name === 'Hips.position') for (let i = 0; i < t.values.length; i++) t.values[i] *= ratio;
      clips[c.name] = c;
    }
    console.log('retarget hip ratio', ratio);
  }
  // measure with skinning applied (posed by the first requested clip at t=0)
  const first = clips[anims[0].clip] || null;
  if (first) { mixer.clipAction(first).play(); mixer.setTime(0); }
  model.updateMatrixWorld(true);
  const box = new THREE.Box3();
  model.traverse(o => {
    if (o.isSkinnedMesh) { o.skeleton.update(); o.computeBoundingBox(); box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld)); }
    else if (o.isMesh) { o.geometry.computeBoundingBox(); box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld)); }
  });
  mixer.stopAllAction();
  const h = box.max.y - box.min.y;
  model.position.y -= box.min.y;                       // feet on the ground
  model.position.x -= (box.min.x + box.max.x) / 2;
  model.position.z -= (box.min.z + box.max.z) / 2;
  let horse = null, mount = null, seat = () => {};
  if (cfg.mount) {
    mount = new THREE.Group(); holder.remove(model); holder.add(mount);
    horse = buildHorse(h, cfg.horse || {}); mount.add(horse); mount.add(model);
    const hips = []; model.traverse(o => { if (o.isBone && o.name === 'Hips') hips.push(o); });
    const base = model.position.clone();
    seat = () => {   // put the rider's hips on the saddle
      model.position.copy(base); model.updateMatrixWorld(true); horse.updateMatrixWorld(true);
      const hp = new THREE.Vector3(); hips[0].getWorldPosition(hp); mount.worldToLocal(hp);
      const U = horse.userData, sp = new THREE.Vector3(0, 0.2 * U.S, 0.02 * U.S); U.body.localToWorld(sp); mount.worldToLocal(sp);
      model.position.x += sp.x - hp.x; model.position.y += sp.y - hp.y + 0.03 * h; model.position.z += sp.z - hp.z;
    };
  }
  // orthographic camera sized so the character is `height` px tall
  const unitsPerPx = h / height;
  const half = frame / 2 * unitsPerPx;
  const cam = new THREE.OrthographicCamera(-half, half, half, -half, -100 * h, 100 * h);
  const elev = THREE.MathUtils.degToRad(30), azim = THREE.MathUtils.degToRad(45);
  const dist = 10 * h;
  cam.position.set(Math.sin(azim) * Math.cos(elev) * dist, Math.sin(elev) * dist, Math.cos(azim) * Math.cos(elev) * dist);
  // ground point sits 28% up from the bottom of the frame
  const look = new THREE.Vector3(0, 0, 0);
  cam.lookAt(look);
  cam.updateMatrixWorld();
  const shift = (frame * 0.22) * unitsPerPx; // move the view down so feet sit low in the frame
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(cam.quaternion);
  cam.position.addScaledVector(up, shift); cam.updateMatrixWorld();
  // light from the screen's top-left
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(cam.quaternion);
  sun.position.copy(cam.position.clone().normalize().multiplyScalar(dist)).addScaledVector(right, -dist * 0.8).addScaledVector(up, dist * 0.9);
  // anchor (ground point under the model) in frame pixels
  const p = new THREE.Vector3(0, 0, 0).project(cam);
  const anchor = { x: (p.x + 1) / 2 * frame, y: (1 - p.y) / 2 * frame };

  const out = {};
  const canvas = document.createElement('canvas');
  for (const a of anims) {
    let clip = clips[a.clip];
    if (!clip && a.clip === '__static') clip = new THREE.AnimationClip('static', 1, []);
    if (clip && a.lockRoot) {
      clip = clip.clone();
      for (const t of clip.tracks) if (t.name === 'Hips.position') {
        const v = t.values, x0 = v[0], z0 = v[2];
        for (let i = 0; i < v.length; i += 3) { v[i] = x0; v[i + 2] = z0; }
      }
    }
    const attached = (a.props || []).map(sp => attachProp(model, h, sp)).filter(Boolean);
    // mounted: lower body from a.clip (sitting), upper body from a.upper (e.g. sword slash)
    let upperClip = null;
    if (cfg.mount && a.upper && clips[a.upper]) {
      const LOW = /Hips|UpLeg|Leg|Foot|Toe/;
      upperClip = clips[a.upper].clone(); upperClip.tracks = upperClip.tracks.filter(t => !LOW.test(t.name.split('.')[0]));
      if (clip) { clip = clip.clone(); clip.tracks = clip.tracks.filter(t => LOW.test(t.name.split('.')[0])); }
    }
    if (!clip) { out[a.name] = { error: 'missing clip ' + a.clip, clips: Object.keys(clips) }; continue; }
    const n = a.frames;
    canvas.width = frame * n; canvas.height = frame * dirs;
    const ctx = canvas.getContext('2d');
    mixer.stopAllAction();
    const act = mixer.clipAction(clip); act.reset().play();
    if (upperClip) mixer.clipAction(upperClip).reset().play();
    const upDur = upperClip ? upperClip.duration : 0;
    for (let d = 0; d < dirs; d++) {
      // screen directions starting at "toward the viewer" (S), clockwise on screen: S, SW, W, NW, N, NE, E, SE
      holder.rotation.y = azim + (d + dirOffset) * Math.PI * 2 / 8;
      for (let i = 0; i < n; i++) {
        const t0 = (a.start || 0) * clip.duration, t1 = (a.end || 1) * clip.duration;
        const u = i / n, tri = 1 - Math.abs(2 * u - 1);   // ping-pong ramp for swing-style loops
        const t = a.loop === false ? t0 + (t1 - t0) * i / Math.max(1, n - 1)
                : a.pingpong ? t0 + (t1 - t0) * tri
                : t0 + (t1 - t0) * u;
        const tt = Math.min(t, clip.duration * 0.999);
        if (upperClip) {   // drive both clips by the same phase
          act.time = tt; const ua = mixer.clipAction(upperClip);
          const u0 = (a.ustart || 0) * upDur, u1 = (a.uend || 1) * upDur, uu = a.pingpong ? tri : (a.loop === false ? i / Math.max(1, n - 1) : u);
          ua.time = Math.min(u0 + (u1 - u0) * uu, upDur * 0.999); mixer.update(0);
        } else mixer.setTime(tt);
        if (model.userData.pose) model.userData.pose(a.gait || a.name, a.loop === false ? i / Math.max(1, n - 1) : i / n);
        if (horse) {
          const ph = a.loop === false ? i / Math.max(1, n - 1) : i / n;
          poseHorse(horse, a.gait || 'idle', ph);
          seat();
          if (a.gait === 'death') {   // horse and rider topple sideways
            const k = Math.min(1, ph * 1.4), e = k * k * (3 - 2 * k);
            mount.rotation.z = e * 1.45; mount.position.y = 0; mount.position.x = -e * 0.25 * h;
          } else { mount.rotation.z = 0; mount.position.x = 0; }
        }
        renderer.render(scene, cam);
        ctx.drawImage(renderer.domElement, i * frame, d * frame);
      }
    }
    for (const p of attached) p.parent.remove(p);
    out[a.name] = { png: canvas.toDataURL('image/png'), frames: n, dirs, frame, anchor, duration: clip.duration };
  }
  return out;
};
window.ready = true;
</script>
