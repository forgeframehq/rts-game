<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head>
<body>
<script type="module">
import * as THREE from './lib/three.module.js';
import { GLTFLoader } from './lib/loaders/GLTFLoader.js';

// Renders a rigged glTF character into isometric sprite sheets:
// one image per animation, rows = 8 screen directions, columns = frames.
// Camera matches the game: orthographic, 30° elevation, 45° azimuth (2:1 isometric).
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);


// ---------- Props (tools) built in code: free and reusable for every character ----------
const M = (c, r = 0.85) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: c === 0x9aa0a6 ? 0.55 : 0.05 });
const WOOD = M(0x7a5230), DARKWOOD = M(0x5a3a1f), IRON = M(0x9aa0a6, 0.45), WICKER = M(0xa77b45), BERRY = M(0xb3263a, 0.6), WHEAT = M(0xd9b44a), SACK = M(0x8c7b5a), ORE = M(0x8f8a80, 0.7), GOLD = M(0xe8c040, 0.4);
function cyl(r, len, mat, seg = 8) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat); return m; }
function box(w, h, d, mat) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); }
// Tools: handle along +Y, grip at the origin. Units = fraction of character height.
const TOOLS = {
  axe() { const g = new THREE.Group(); const h = cyl(0.012, 0.40, WOOD); h.position.y = 0.14; g.add(h);
    const b = box(0.012, 0.07, 0.09, IRON); b.position.set(0, 0.31, 0.045); g.add(b); return g; },
  pickaxe() { const g = new THREE.Group(); const h = cyl(0.012, 0.40, WOOD); h.position.y = 0.14; g.add(h);
    const head = box(0.022, 0.025, 0.24, IRON); head.position.y = 0.33; g.add(head);
    const t1 = new THREE.Mesh(new THREE.ConeGeometry(0.013, 0.05, 6), IRON); t1.rotation.x = Math.PI / 2; t1.position.set(0, 0.33, 0.14); g.add(t1);
    const t2 = t1.clone(); t2.rotation.x = -Math.PI / 2; t2.position.z = -0.14; g.add(t2); return g; },
  mallet() { const g = new THREE.Group(); const h = cyl(0.011, 0.30, WOOD); h.position.y = 0.1; g.add(h);
    const head = cyl(0.04, 0.12, DARKWOOD, 10); head.rotation.x = Math.PI / 2; head.position.y = 0.26; g.add(head); return g; },
  sickle() { const g = new THREE.Group(); const h = cyl(0.011, 0.11, WOOD); h.position.y = 0.02; g.add(h);
    const blade = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.007, 4, 16, Math.PI * 1.2), IRON); blade.position.set(0, 0.12, 0.06); blade.rotation.y = Math.PI / 2; g.add(blade); return g; },
  sword() { const g = new THREE.Group(); const h = cyl(0.012, 0.07, DARKWOOD); g.add(h);
    const guard = box(0.016, 0.016, 0.1, IRON); guard.position.y = 0.04; g.add(guard);
    const blade = box(0.008, 0.40, 0.04, IRON); blade.position.y = 0.25; g.add(blade); return g; },
  basket() { const g = new THREE.Group(); const b = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.055, 0.07, 12, 1, true), WICKER); b.material.side = THREE.DoubleSide; g.add(b);
    const bottom = cyl(0.055, 0.005, WICKER, 12); bottom.position.y = -0.035; g.add(bottom);
    for (let i = 0; i < 9; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(0.014, 6, 5), BERRY); s.position.set(Math.cos(i * 2.4) * 0.04 * (i % 3) / 2, 0.03, Math.sin(i * 2.4) * 0.04 * (i % 3) / 2); g.add(s); } return g; },
  logs() { const g = new THREE.Group(); [[0, 0], [0.05, 0], [0.025, 0.043], [-0.05, 0], [-0.025, 0.043]].forEach(([x, y]) => { const l = cyl(0.026, 0.30, WOOD, 7); l.rotation.z = Math.PI / 2; l.position.set(0, y, x); g.add(l); }); return g; },
  sack() { const g = new THREE.Group(); const s = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), SACK); s.scale.set(1, 0.85, 0.9); g.add(s);
    for (let i = 0; i < 4; i++) { const o = new THREE.Mesh(new THREE.DodecahedronGeometry(0.03), i % 2 ? GOLD : ORE); o.position.set(Math.cos(i * 1.7) * 0.04, 0.08, Math.sin(i * 1.7) * 0.04); g.add(o); } return g; },
  shield() { const g = new THREE.Group();   // kite shield, face along +Z, strap at origin
    const sh = new THREE.Shape(); sh.moveTo(0, 0.13); sh.quadraticCurveTo(0.075, 0.13, 0.075, 0.06); sh.quadraticCurveTo(0.07, -0.06, 0, -0.17); sh.quadraticCurveTo(-0.07, -0.06, -0.075, 0.06); sh.quadraticCurveTo(-0.075, 0.13, 0, 0.13);
    const face = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: 0.012, bevelEnabled: false }), new THREE.MeshStandardMaterial({ color: 0xff00ff, roughness: 0.7 }));
    face.position.z = 0.012; g.add(face);
    const rim = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: 0.008, bevelEnabled: false }), DARKWOOD); rim.scale.setScalar(1.06); g.add(rim);
    const boss = new THREE.Mesh(new THREE.SphereGeometry(0.018, 8, 6), IRON); boss.position.set(0, 0.03, 0.028); g.add(boss); return g; },
  spear() { const g = new THREE.Group(); const h = cyl(0.009, 0.95, WOOD); h.position.y = 0.12; g.add(h);
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.018, 0.09, 6), IRON); tip.position.y = 0.64; g.add(tip); return g; },
  longbow() { const g = new THREE.Group();   // grip at origin, limbs along Y, string toward -Z
    const c = new THREE.QuadraticBezierCurve3(new THREE.Vector3(0, -0.42, -0.05), new THREE.Vector3(0, 0, 0.09), new THREE.Vector3(0, 0.42, -0.05));
    g.add(new THREE.Mesh(new THREE.TubeGeometry(c, 16, 0.008, 5), WOOD));
    const st = cyl(0.0015, 0.84, M(0xdddddd)); st.position.z = -0.05; g.add(st); return g; },
  quiver() { const g = new THREE.Group(); const q = cyl(0.03, 0.26, M(0x6b4423), 8); g.add(q);
    for (let i = 0; i < 5; i++) { const a = cyl(0.003, 0.08, M(0xeeeeee), 4); a.position.set(Math.cos(i * 1.3) * 0.015, 0.16, Math.sin(i * 1.3) * 0.015); g.add(a); } return g; },
  foodbasket() { const g = TOOLS.basket(); g.scale.setScalar(1.6);
    for (let i = 0; i < 7; i++) { const w = cyl(0.004, 0.09, WHEAT, 4); w.position.set(-0.03 + i * 0.01, 0.08, 0.01 * (i % 3)); w.rotation.z = (i - 3) * 0.08; g.add(w); } return g; },
};
function attachProp(model, h, spec) {
  if (!spec) return null;
  let bone = null; model.traverse(o => { if (o.isBone && o.name === spec.bone) bone = o; });
  if (!bone) return null;
  const pivot = new THREE.Group();
  const tool = TOOLS[spec.tool](); tool.scale.setScalar(h * (spec.scale || 1));
  const inner = new THREE.Group(); inner.add(tool);
  inner.rotation.set(...(spec.rot || [0, 0, 0]));
  inner.position.set(...(spec.pos || [0, 0, 0]).map(v => v * h));
  pivot.add(inner);
  model.updateMatrixWorld(true);
  const ws = new THREE.Vector3(); bone.getWorldScale(ws);
  pivot.scale.set(1 / ws.x, 1 / ws.y, 1 / ws.z);
  bone.add(pivot);
  pivot.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
  return pivot;
}

window.renderAll = async function (cfg) {
  const { url, frame = 192, height = 150, anims, dirs = 8, light = 1, dirOffset = 0 } = cfg;
  renderer.setSize(frame, frame);
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xfff4e0, 0x5a4a38, 1.25 * light));
  const sun = new THREE.DirectionalLight(0xfff1d6, 2.4 * light);
  scene.add(sun);
  const gltf = await new GLTFLoader().loadAsync(url);
  const model = gltf.scene;
  model.traverse(o => { if (o.isMesh) { o.frustumCulled = false; if (o.material) o.material.side = THREE.FrontSide; } });
  const holder = new THREE.Group(); holder.add(model); scene.add(holder);
  // measure standing height from the first frame of the first requested clip (or bind pose)
  const mixer = new THREE.AnimationMixer(model);
  const clips = {}; for (const c of gltf.animations) clips[c.name] = c;
  for (const cu of [].concat(cfg.clipsUrl || [])) {   // borrow clips from other files on the same skeleton (bone names match)
    const src = await new GLTFLoader().loadAsync(cu);
    const hipY = r => { let y = 1; r.traverse(o => { if (o.isBone && o.name === 'Hips') y = o.position.y; }); return y; };
    const ratio = hipY(model) / hipY(src.scene);
    for (const c0 of src.animations) {
      const c = c0.clone();
      for (const t of c.tracks) if (t.name === 'Hips.position') for (let i = 0; i < t.values.length; i++) t.values[i] *= ratio;
      clips[c.name] = c;
    }
    console.log('retarget hip ratio', ratio);
  }
  // measure with skinning applied (posed by the first requested clip at t=0)
  const first = clips[anims[0].clip] || null;
  if (first) { mixer.clipAction(first).play(); mixer.setTime(0); }
  model.updateMatrixWorld(true);
  const box = new THREE.Box3();
  model.traverse(o => {
    if (o.isSkinnedMesh) { o.skeleton.update(); o.computeBoundingBox(); box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld)); }
    else if (o.isMesh) { o.geometry.computeBoundingBox(); box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld)); }
  });
  mixer.stopAllAction();
  const h = box.max.y - box.min.y;
  model.position.y -= box.min.y;                       // feet on the ground
  model.position.x -= (box.min.x + box.max.x) / 2;
  model.position.z -= (box.min.z + box.max.z) / 2;
  // orthographic camera sized so the character is `height` px tall
  const unitsPerPx = h / height;
  const half = frame / 2 * unitsPerPx;
  const cam = new THREE.OrthographicCamera(-half, half, half, -half, -100 * h, 100 * h);
  const elev = THREE.MathUtils.degToRad(30), azim = THREE.MathUtils.degToRad(45);
  const dist = 10 * h;
  cam.position.set(Math.sin(azim) * Math.cos(elev) * dist, Math.sin(elev) * dist, Math.cos(azim) * Math.cos(elev) * dist);
  // ground point sits 28% up from the bottom of the frame
  const look = new THREE.Vector3(0, 0, 0);
  cam.lookAt(look);
  cam.updateMatrixWorld();
  const shift = (frame * 0.22) * unitsPerPx; // move the view down so feet sit low in the frame
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(cam.quaternion);
  cam.position.addScaledVector(up, shift); cam.updateMatrixWorld();
  // light from the screen's top-left
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(cam.quaternion);
  sun.position.copy(cam.position.clone().normalize().multiplyScalar(dist)).addScaledVector(right, -dist * 0.8).addScaledVector(up, dist * 0.9);
  // anchor (ground point under the model) in frame pixels
  const p = new THREE.Vector3(0, 0, 0).project(cam);
  const anchor = { x: (p.x + 1) / 2 * frame, y: (1 - p.y) / 2 * frame };

  const out = {};
  const canvas = document.createElement('canvas');
  for (const a of anims) {
    let clip = clips[a.clip];
    if (!clip && a.clip === '__static') clip = new THREE.AnimationClip('static', 1, []);
    if (clip && a.lockRoot) {
      clip = clip.clone();
      for (const t of clip.tracks) if (t.name === 'Hips.position') {
        const v = t.values, x0 = v[0], z0 = v[2];
        for (let i = 0; i < v.length; i += 3) { v[i] = x0; v[i + 2] = z0; }
      }
    }
    const attached = (a.props || []).map(sp => attachProp(model, h, sp)).filter(Boolean);
    if (!clip) { out[a.name] = { error: 'missing clip ' + a.clip, clips: Object.keys(clips) }; continue; }
    const n = a.frames;
    canvas.width = frame * n; canvas.height = frame * dirs;
    const ctx = canvas.getContext('2d');
    mixer.stopAllAction();
    const act = mixer.clipAction(clip); act.reset().play();
    for (let d = 0; d < dirs; d++) {
      // screen directions starting at "toward the viewer" (S), clockwise on screen: S, SW, W, NW, N, NE, E, SE
      holder.rotation.y = azim + (d + dirOffset) * Math.PI * 2 / 8;
      for (let i = 0; i < n; i++) {
        const t0 = (a.start || 0) * clip.duration, t1 = (a.end || 1) * clip.duration;
        const u = i / n, tri = 1 - Math.abs(2 * u - 1);   // ping-pong ramp for swing-style loops
        const t = a.loop === false ? t0 + (t1 - t0) * i / Math.max(1, n - 1)
                : a.pingpong ? t0 + (t1 - t0) * tri
                : t0 + (t1 - t0) * u;
        const tt = Math.min(t, clip.duration * 0.999);
        mixer.setTime(tt);
        renderer.render(scene, cam);
        ctx.drawImage(renderer.domElement, i * frame, d * frame);
      }
    }
    for (const p of attached) p.parent.remove(p);
    out[a.name] = { png: canvas.toDataURL('image/png'), frames: n, dirs, frame, anchor, duration: clip.duration };
  }
  return out;
};
window.ready = true;
</script>
</body></html>
